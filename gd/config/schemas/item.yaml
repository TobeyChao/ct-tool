table: item
primary: id
fields:
  - name: id
    type: int32
    comment: "道具唯一ID，禁止修改"
  - name: name
    type: string
    i18n: true
    comment: "道具名称（多语言）"
  - name: price
    type: float
    comment: "售价（金币），0=不可出售"
  - name: rarity
    type: enum
    values: [common, rare, epic]
    comment: "稀有度"
  - name: item_type_id
    type: int32
    ref: item_type.id
    comment: "道具类型，关联 item_type.id"
  - name: drop_range
    type: struct
    fields:
      - name: min
        type: int32
        comment: "掉落数量下限"
      - name: max
        type: int32
        comment: "掉落数量上限"
  - name: tags
    type: array
    element: int32
    separator: ","
    comment: "标签列表，逗号分隔"
  - name: is_active
    type: bool
    server_only: true
    comment: "是否启用（仅服务端）"
