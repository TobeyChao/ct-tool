name: native

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 任务 1.1：基线源码树指纹必须与提交的源码一致（环境字段不参与判定）
      - name: 基线源码树指纹自检
        run: cargo run -p ct-xtask -- fingerprint --check
      - run: cargo build --release -p ct-cli
      # 任务 1.3/6.6：三平台都要跑独立 CLI/worker smoke——中文与空格路径、
      # PATH 收敛为包内单目录、无 Python 环境，由 xtask dist 自检并落盘 RUNTIME-CHECK.txt
      - name: 独立运行时包与 CLI/worker smoke
        run: cargo run -p ct-xtask -- dist
      - name: 上传运行时包
        uses: actions/upload-artifact@v4
        with:
          name: ct-native-${{ matrix.os }}
          path: native/dist/*.zip
          if-no-files-found: warn
      # 任务 6.4：CLI 文本与产物对照只在装了参照 venv 的环境跑；CI 不依赖 Python
      - name: 运行时包自检结论摘要
        run: cat dist/*/RUNTIME-CHECK.txt

  # 桌面壳：Dart 侧协议契约与真实 worker 进程对照（native-flutter-workbench 2.1/2.2）
  workbench:
    name: 桌面壳（Flutter）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建原生二进制（真实 worker 测试需要）
        run: cargo build -p ct-cli
        working-directory: native
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: launcher
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: launcher
      - run: flutter analyze
        working-directory: launcher
      - name: 桌面壳测试（含真实 ct worker 握手与请求关联）
        run: flutter test
        working-directory: launcher
        env:
          CT_WORKER_BIN: ../native/target/debug/ct.exe
      - name: 正式桌面构建入口（只嵌原生运行时）
        run: cargo run -p ct-xtask --release -- dist
        working-directory: native
      - name: 构建 Windows 桌面负载
        run: pwsh launcher/tool/build_windows.ps1
      - name: 发行负载不得含/启动 Python 或 Flask（任务 5.6）
        run: pwsh launcher/tool/check_payload.ps1
