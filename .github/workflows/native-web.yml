name: Native Web
on:
  push:
    paths: ['native/**', 'web/**', 'launcher/**', '.github/workflows/native-web.yml']
  pull_request:
    paths: ['native/**', 'web/**', 'launcher/**', '.github/workflows/native-web.yml']
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path native/Cargo.toml -p ct-cli --locked
      - run: node web/tools/check-parity.mjs
      - run: npm ci --prefix web
      - run: npm run test:http --prefix web
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx --prefix web playwright install --with-deps chromium
      - name: Browser acceptance against native panel
        if: runner.os == 'Linux'
        run: npm test --prefix web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-web-${{ matrix.os }}
          path: web/test-results
          if-no-files-found: ignore
