name: Native Web
on:
  push:
    paths: ['native/**', 'web/**', 'launcher/**', 'test-proj/**', '.github/workflows/native-web.yml']
  pull_request:
    paths: ['native/**', 'web/**', 'launcher/**', 'test-proj/**', '.github/workflows/native-web.yml']
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve byte-exact frozen references on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path native/Cargo.toml -p ct-cli --locked
      - name: Compare six frozen CLI scenarios and artifact digests
        run: node native/tools/parity/cli-text-diff.mjs --rust native/target/debug/ct${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify independent oracles and regenerate Excel boundary inputs
        run: cargo run --manifest-path native/Cargo.toml -p ct-xtask --locked -- compat-fixtures
      - name: Regenerate and validate native benchmark fixture
        run: |
          cargo run --manifest-path native/Cargo.toml -p ct-xtask --locked -- bench-fixtures --sizes s
          cargo run --manifest-path native/Cargo.toml -p ct-cli --locked -- validate --root native/target/bench/bench-s
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Audit test-proj entries and run independent C# reader
        env:
          CT_NATIVE_BIN: ${{ github.workspace }}/native/target/debug/ct${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          node test-proj/check-retirement.mjs
          node test-proj/ExportAccessorVerify/prepare-native.mjs
      - run: node web/tools/check-parity.mjs
      - run: npm ci --prefix web
      - run: npm run test:http --prefix web
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx --prefix web playwright install --with-deps chromium
      - name: Browser acceptance against native panel
        if: runner.os == 'Linux'
        run: npm test --prefix web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-web-${{ matrix.os }}
          path: web/test-results
          if-no-files-found: ignore
