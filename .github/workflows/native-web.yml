name: Native Web
on:
  push:
    paths: ['native/**', 'web/**', 'launcher/**', 'test-proj/**', 'docs/**', 'README.md', 'AGENTS.md', '.github/workflows/native-web.yml']
  pull_request:
    paths: ['native/**', 'web/**', 'launcher/**', 'test-proj/**', 'docs/**', 'README.md', 'AGENTS.md', '.github/workflows/native-web.yml']
jobs:
  native:
    runs-on: macos-latest
    steps:
      - name: Preserve byte-exact frozen references
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify real workspace is clean before acceptance
        run: node native/tools/gd-guard.mjs --status
      - name: Rust formatting and static analysis
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Verify source fingerprint and test inventory
        run: cargo run --manifest-path native/Cargo.toml -p ct-xtask --locked -- fingerprint --check
      - name: Verify Python retirement scope and active documentation
        run: |
          node native/tools/check-retirement.mjs --after-deletion
          node native/tools/check-docs.mjs
      - run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path native/Cargo.toml -p ct-cli --locked
      - name: Compare six frozen CLI scenarios and artifact digests
        run: node native/tools/parity/cli-text-diff.mjs --rust native/target/debug/ct
      - name: Verify independent oracles and regenerate Excel boundary inputs
        run: cargo run --manifest-path native/Cargo.toml -p ct-xtask --locked -- compat-fixtures
      - name: Regenerate and validate native benchmark fixture
        run: |
          cargo run --manifest-path native/Cargo.toml -p ct-xtask --locked -- bench-fixtures --sizes s
          cargo run --manifest-path native/Cargo.toml -p ct-cli --locked -- validate --root native/target/bench/bench-s
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Audit test-proj entries and run independent C# reader
        env:
          CT_NATIVE_BIN: ${{ github.workspace }}/native/target/debug/ct
        run: |
          node test-proj/check-retirement.mjs
          node test-proj/ExportAccessorVerify/prepare-native.mjs
      - run: node web/tools/check-parity.mjs --require-complete
      - run: npm ci
        working-directory: web
      - run: npm run test:http
        working-directory: web
      - name: Build and smoke isolated native distribution
        run: cargo run --manifest-path native/Cargo.toml -p ct-xtask --locked -- dist
      - name: Verify native payload and use packaged panel for browser acceptance
        run: |
          PACKAGE=$(find native/dist -type f -path '*/bin/ct' -print | head -n 1)
          node native/tools/check-package.mjs --package "$(dirname "$(dirname "$PACKAGE")")" --out native/dist/payload-check.json
          echo "CT_WEB_BIN=$GITHUB_WORKSPACE/$PACKAGE" >> "$GITHUB_ENV"
          echo "CT_LAUNCHER_TEST_BIN=$GITHUB_WORKSPACE/$PACKAGE" >> "$GITHUB_ENV"
          echo "CT_WORKER_BIN=$GITHUB_WORKSPACE/$PACKAGE" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          # Keep the renderer aligned with the checked-in macOS golden images.
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Flutter workbench, native worker, and static analysis
        working-directory: launcher
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter test
          flutter analyze
      - name: Package macOS launcher with checked native runtime
        run: |
          PACKAGE=$(find native/dist -type f -path '*/bin/ct' -print | head -n 1)
          RUNTIME_PACKAGE="$(dirname "$(dirname "$PACKAGE")")" bash launcher/tool/build_macos.sh
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: web
      - name: Browser acceptance against native panel
        run: npm test
        working-directory: web
      - name: Verify acceptance did not modify the real workspace
        if: always()
        run: node native/tools/gd-guard.mjs --status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-web-macos
          path: |
            web/test-results
            native/dist
            launcher/build/macos/*.dmg
            launcher/build/macos/payload-check.json
          if-no-files-found: ignore
