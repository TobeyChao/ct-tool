name: Historical Python reference (manual only)

# Migration reference only; removed at the Python retirement gate.
on: workflow_dispatch

jobs:
  pytest:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ct/pyproject.toml
      - name: Install ct and browser test dependencies
        run: |
          python -m pip install -e ".[test]"
          python -m playwright install chromium
      - name: Run pytest and capture browser matrix
        env:
          CT_WEB_SCREENSHOT_DIR: ${{ github.workspace }}/test-artifacts/web-v4-baseline
        run: python -m pytest
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v4-baseline
          path: test-artifacts/web-v4-baseline
          if-no-files-found: error
