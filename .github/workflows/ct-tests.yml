name: ct tests

on:
  push:
    paths:
      - "ct/**"
      - ".github/workflows/ct-tests.yml"
  pull_request:
    paths:
      - "ct/**"
      - ".github/workflows/ct-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ct/pyproject.toml
      - name: Install ct and browser test dependencies
        run: |
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Run pytest and capture browser matrix
        env:
          CT_WEB_SCREENSHOT_DIR: ${{ github.workspace }}/test-artifacts/web-v4-baseline
        run: python -m pytest
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v4-baseline
          path: test-artifacts/web-v4-baseline
          if-no-files-found: error
