[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-tool"
version = "0.1.0"
description = "配表导出工具 - Excel → JSON / FlatBuffers Binary"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "flatbuffers==25.12.19",
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "flask>=3.0",
]

[project.scripts]
ct = "ct.cli:app"

[tool.setuptools.packages.find]
include = ["ct*"]
