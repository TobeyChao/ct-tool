<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ct 配表工具</title>
<style>
:root {
  --bg: #F5F6F4;
  --surface: #FFFFFF;
  --surface-2: #F0F2EE;
  --border: #E1E6DD;
  --border-strong: #CBD2C6;
  --ink: #1B241F;
  --ink-2: #5A645E;
  --ink-3: #8B948E;
  --primary: #1B4332;
  --primary-hover: #153728;
  --accent: #2F7A56;
  --accent-hover: #266544;
  --accent-soft: #D8F3DC;
  --accent-softer: #ECF7ED;
  --gold: #C9A227;
  --gold-soft: #F7EECB;
  --danger: #B23B3B;
  --danger-soft: #F9E8E8;
  --warn: #B7791F;
  --warn-soft: #F9EFD9;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --r: 8px;
  --shadow-panel: 0 1px 2px rgba(27, 36, 31, 0.04), 0 8px 28px rgba(27, 36, 31, 0.05);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; height: 56px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--primary); display: grid; place-items: center; color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
.brand-name { font-size: 14px; }
.brand-sub { color: var(--ink-3); font-size: 12px; font-weight: 400; }
.topbar-spacer { flex: 1; }
.workspace-path { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 12px; white-space: nowrap; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; background: var(--surface); white-space: nowrap; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

.tabs { position: sticky; top: 56px; z-index: 18; display: flex; gap: 6px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab { appearance: none; border: 0; background: transparent; font-family: inherit; font-size: 14px; color: var(--ink-2); padding: 13px 16px 11px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); }
.tab-count { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; text-align: center; }
.tab.active .tab-count { background: var(--accent-soft); color: var(--primary); }

.layout { max-width: 1160px; margin: 0 auto; padding: 22px; display: grid; gap: 20px; }
.tab-page { display: none; }
.tab-page.active { display: block; }

.banner-error { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--danger-soft); border-left: 3px solid var(--danger); border-radius: var(--r); font-size: 13px; }
.banner-error .banner-fix { color: var(--ink-2); font-size: 12.5px; }
.banner-error .btn { margin-left: auto; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-panel); }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; }
.panel-title { font-size: 15px; font-weight: 650; }
.panel-sub { font-size: 12px; color: var(--ink-3); }
.panel-body { padding: 16px 20px 20px; }

.btn { appearance: none; border: 1px solid transparent; border-radius: var(--r); font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 18px; cursor: pointer; transition: background 0.12s ease, transform 0.06s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-hover); }
.btn-ghost { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--surface); border-color: #D9A6A6; color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; align-items: center; }

.cmd-bar { position: sticky; top: 105px; z-index: 15; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; min-height: 64px; padding: 12px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-panel); }
.cmd-group { display: flex; align-items: center; gap: 8px; }
.cmd-label { font-size: 11px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.04em; white-space: nowrap; }
.cmd-value { font-family: var(--font-mono); font-size: 12.5px; font-weight: 650; color: var(--ink); }
.cmd-spacer { flex: 1; }
.cmd-vsep { width: 1px; height: 22px; background: var(--border); }
.cmd-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.cmd-check input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
.cmd-search { font-family: var(--font-mono); font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); width: 180px; }

.pill { appearance: none; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-2); font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.pill:hover { background: var(--surface-2); }
.pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.seg { display: inline-flex; gap: 4px; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.badge-ok { background: var(--accent-soft); color: var(--primary); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-err { background: var(--danger-soft); color: var(--danger); }
.badge-mute { background: var(--surface-2); color: var(--ink-2); }
.tag { display: inline-block; font-size: 11px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 8px; line-height: 20px; }
.pk-cell { font-family: var(--font-mono); font-weight: 650; color: #7A6214; background: var(--gold-soft); border-radius: 4px; padding: 2px 8px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }

.table-wrap { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-top: 14px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover { background: var(--accent-softer); }
.src-cell { width: 240px; min-width: 160px; }
.src-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; color: var(--ink-2); }
.src-text.expanded { -webkit-line-clamp: unset; overflow: visible; }
.trans-cell { min-width: 200px; }
.trans-input { width: 100%; font-family: var(--font-mono); font-size: 12px; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface); color: var(--ink); }
.trans-input.is-area { min-height: 64px; resize: vertical; line-height: 1.55; }
.trans-preview { min-height: 30px; padding: 4px 2px; font-family: var(--font-mono); font-size: 12px; color: var(--ink); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; line-height: 1.5; border-radius: 4px; }
.trans-preview:hover { background: var(--surface-2); }
.trans-preview.placeholder { color: var(--ink-3); }
.empty-cell { text-align: center; color: var(--ink-3); padding: 26px 0; }
.empty-state { text-align: center; padding: 30px 12px; }
.empty-state .empty-title { font-weight: 600; color: var(--ink-2); }
.empty-state .empty-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

.cell-progress { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 14px 0 12px; }
.prog-cell { border: 1px solid var(--border); border-radius: var(--r); padding: 10px 6px; text-align: center; background: var(--surface); }
.prog-cell .p-num { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink-3); }
.prog-cell .p-name { display: block; font-size: 12px; margin-top: 2px; color: var(--ink-2); }
.prog-cell.done { background: var(--accent-soft); border-color: var(--accent); }
.prog-cell.done .p-num, .prog-cell.done .p-name { color: var(--primary); }
.prog-cell.active { border-color: var(--primary); box-shadow: inset 0 -2px 0 var(--primary); }
.prog-cell.error { background: var(--danger-soft); border-color: var(--danger); }
.progress-line { font-size: 13px; margin: 8px 0; }
.summary-line { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.cmd-footnote { display: flex; align-items: baseline; gap: 12px; margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }

.schema-list { display: grid; gap: 10px; margin-top: 14px; }
.schema-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 13px 16px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.schema-row:hover { border-color: var(--border-strong); }
.schema-row .schema-id { min-width: 150px; }
.schema-name { font-weight: 650; font-size: 14px; }
.schema-pk { font-size: 12px; color: var(--ink-3); }
.schema-row .row-meta { color: var(--ink-3); }
.schema-row .btn-row-detail { margin-left: auto; }
.kv-grid { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px 20px; margin-bottom: 16px; }
.kv-label { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }
.kv-value { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }
.field { margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--ink-2); display: block; margin-bottom: 6px; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.field-list { display: grid; gap: 6px; }
.field-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.field-row .mono { flex: 1; min-width: 0; }
.f-meta { font-size: 11.5px; color: var(--ink-3); }
.form-input { width: 100%; padding: 7px 10px; font-family: var(--font-mono); font-size: 12.5px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.form-area { height: 150px; resize: vertical; line-height: 1.55; }

.modal-mask { position: fixed; inset: 0; background: rgba(27, 36, 31, 0.35); display: grid; place-items: center; z-index: 50; }
.modal { width: min(560px, calc(100vw - 40px)); background: var(--surface); border-radius: var(--r); box-shadow: 0 20px 60px rgba(27, 36, 31, 0.25); overflow: hidden; }
.modal-lg { width: min(680px, calc(100vw - 40px)); }
.modal-head { display: flex; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 650; }
.modal-body { padding: 18px 22px; max-height: 70vh; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; font-size: 13px; }
.pick-row + .pick-row { margin-top: 6px; }
.pick-row:hover { background: var(--surface-2); }
.pick-row input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.pick-row .opt-meta { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.pick-row.auto { background: var(--accent-softer); border-color: var(--accent-soft); }
.side-row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
.side-row:last-child { border-bottom: 0; }
.side-name { flex: 1; font-size: 13px; }
.side-val { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); }
.side-badges { display: inline-flex; gap: 6px; }

.log-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.log-wrap { position: relative; margin-top: 10px; }
.log-list { border-top: 1px solid var(--border); max-height: 520px; overflow: auto; font-family: var(--font-mono); font-size: 12px; }
.btn-jump-bottom { position: absolute; right: 14px; bottom: 14px; box-shadow: 0 4px 14px rgba(27, 36, 31, 0.18); z-index: 5; }
.log-row { display: grid; grid-template-columns: 76px 52px 52px 1fr; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.log-time { color: var(--ink-3); }
.log-module { color: var(--accent); font-weight: 700; }
.log-level.info { color: var(--ink-3); }
.log-level.warn { color: var(--warn); }
.log-level.error { color: var(--danger); }
.log-msg { word-break: break-word; }

.history-item { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.history-item:last-child { border-bottom: 0; }
.history-time { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.history-scope { font-size: 13px; flex: 1; }
.history-scope small { color: var(--ink-3); }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
