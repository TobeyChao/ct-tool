name: ct_launcher
description: "ct 配表工具桌面启动器：一键启动面板、托盘常驻、开机自启。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  win32_registry: ^2.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
